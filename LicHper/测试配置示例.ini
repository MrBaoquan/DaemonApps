# LicHper 图片水印测试配置示例
# 将此文件复制到 %USERPROFILE%\.authrc.ini 即可使用

[help]
description = {APPID} 为授权软件ID, 在显示时会被替换为真实ID, {COUNTDOWN}为程序退出倒计时 
 dialog 如果启用，则水印文字在dialog中间显示  
 timeout_kill_self 超时是否关闭主进程 
 timeout_kill_other 为退出时同时关闭的进程列表, 多个进程用 | 分隔

[dialog]
enable = false
color = #002F2F
width = 800
height = 400

[watermark]
# ========== 文字水印配置 ==========
# 文字标题（支持占位符 {APPID} 和 {COUNTDOWN}）
# 规则：
#   1. 默认值为 "{APPID} Demo Version"
#   2. 仅在配置了图片水印时，才允许设置为空（title = ）
#   3. 如果没有图片水印且 title 为空，会自动显示默认标题
# 示例：
#   title = {APPID} 试用版本 {COUNTDOWN}  # 自定义标题
#   title =                                 # 空标题（仅在有图片时有效）
title = {APPID} 试用版本 {COUNTDOWN}
font_size = 60
color = #FF6666
animate = true

# ========== 图片水印配置 ==========
# 图片路径（可以是绝对路径或相对于 %USERPROFILE%\.lichper\ 的相对路径）
# 留空则使用默认图片 %USERPROFILE%\.lichper\watermark.png
image_path = 
# 图片缩放比例 (0.1 - 10.0)
image_scale = 1.0
# 图片透明度 (0.3 - 1.0)
image_alpha = 0.7
# 图片对齐方式：top-left, top-center, top-right, center-left, center, center-right, bottom-left, bottom-center, bottom-right
image_align = top-center
# 图片边距（像素）
# 注意：系统会自动确保水印完全在屏幕内，即使 padding 设置过大也会自动调整
image_padding_x = 50
image_padding_y = 50
# 图片动画移动（启用后图片将像文字一样移动，且始终完全显示在屏幕内）
image_animate = false

[program]
timeout = 60
timeout_kill_self = false
timeout_kill_other = 

