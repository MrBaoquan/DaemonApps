# LicHper 图片水印测试配置示例
# 将此文件复制到 %USERPROFILE%\.authrc.ini 即可使用

[help]
description = {APPID} 为授权软件ID, 在显示时会被替换为真实ID, {COUNTDOWN}为程序退出倒计时 
 dialog 如果启用，则水印文字在dialog中间显示  
 timeout_kill_self 超时是否关闭主进程 
 timeout_kill_other 为退出时同时关闭的进程列表, 多个进程用 | 分隔

[dialog]
enable = false
color = #002F2F
width = 800
height = 400

[watermark]
# ========== 文字水印配置 ==========
title = {APPID} 试用版本 {COUNTDOWN}
font_size = 60
color = #FF6666
animate = true

# ========== 图片水印配置 (新增) ==========
# 使用测试图片
image_path = c:\Users\Administrator\source\repos\DaemonApps\LicHper\test_watermark.bmp
image_width = 150
image_height = 150
image_alpha = 0.7
image_position = top

# 图片位置选项:
# - center: 屏幕中央
# - top: 顶部居中
# - bottom: 底部居中
# - left: 左侧居中
# - right: 右侧居中

[program]
timeout = 60
timeout_kill_self = false
timeout_kill_other = 

