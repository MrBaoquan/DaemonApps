[help]
description = {APPID} 为授权软件ID, 在显示时会被替换为真实ID, {COUNTDOWN}为程序退出倒计时 \n timeout_kill_self 超时是否关闭主进程 \n timeout_kill_other 为退出时同时关闭的进程列表, 多个进程用 | 分隔 \n \n 配置说明: \n - [watermark:default] 为所有应用的默认水印配置 \n - [watermark:具体appid] 用来覆盖特定应用的水印配置 \n - [program:default] 为所有应用的默认程序配置 \n - [program:具体appid] 用来覆盖特定应用的程序配置

; ===== 默认水印配置（所有应用都使用此配置，除非被后面的具体配置覆盖）=====
[watermark:default]
title = {APPID} Demo Version
font_size = 80
color = #FF6666
animate = true
image_path = 
image_scale = 1
image_alpha = 0.8
image_align = top-center
image_padding_x = 50
image_padding_y = 50
image_animate = false

; ===== 默认程序配置 =====
[program:default]
timeout = 60
timeout_kill_self = false
timeout_kill_other = 

; ===== 应用 app001 的特定配置（覆盖默认值）=====
[watermark:app001]
title = App001 - Unlicensed Version
font_size = 100
color = #FF0000
animate = true
image_path = watermark_app001.png
image_scale = 1.5
image_alpha = 0.9
image_align = bottom-right
image_padding_x = 20
image_padding_y = 20

[program:app001]
timeout = 120
timeout_kill_self = true
timeout_kill_other = notepad.exe|calculator.exe

; ===== 应用 app002 的特定配置 =====
[watermark:app002]
title = App002 Evaluation
font_size = 60
color = #FFAA00
animate = false
image_path = watermark_app002.png
image_align = center
image_padding_x = 0
image_padding_y = 0

[program:app002]
timeout = 180

; ===== 应用 UnrealEngine5 的特定配置（通常需要特殊处理）=====
[watermark:UnrealEngine5]
title = Unreal Engine - License Required
font_size = 120
color = #00FF00
animate = true
image_path = 
image_scale = 1
image_alpha = 1.0
image_align = top-center
image_padding_x = 50
image_padding_y = 50

[program:UnrealEngine5]
timeout = 300
