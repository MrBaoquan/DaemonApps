# ============================================================
# 参数优先级说明
# ============================================================
# 尺寸控制优先级：
# 1. image_scale > 0 → 使用缩放比例（忽略width/height）
# 2. width和height都>0 → 使用指定尺寸
# 3. 只设置一个 → 保持宽高比
# 4. 都为0 → 使用原始尺寸
#
# 位置控制优先级：
# 1. image_x >= 0 且 image_y >= 0 → 使用自定义坐标
# 2. 否则 → 使用image_position预设位置
#
# 安全限制：
# - image_alpha 限制在 0.3-1.0，确保水印可见
# - 文字水印始终显示，防止完全隐藏授权提示
