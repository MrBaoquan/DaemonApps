# LicHper 图片水印增强配置示例

# ============================================================
# 场景 1: 使用原始尺寸 + 缩放比例 (推荐)
# ============================================================
[watermark]
title = {APPID} 试用版 {COUNTDOWN}
font_size = 80
color = #FF6666
animate = true
image_path = C:\Users\Administrator\source\repos\DaemonApps\LicHper\test_watermark.bmp
image_width = 0          # 0 = 使用原始宽度
image_height = 0         # 0 = 使用原始高度
image_scale = 0.5        # 缩放到原始尺寸的50%
image_alpha = 0.8        # 透明度 0.3-1.0
image_position = center  # 预设位置
image_x = -1             # -1 = 不使用自定义坐标
image_y = -1

[program]
timeout = 300
timeout_kill_self = false
timeout_kill_other = 

